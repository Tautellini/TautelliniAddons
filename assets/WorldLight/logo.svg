    <circle cx="256" cy="216" r="112" fill="url(#sun)" clip-path="url(#left)"/>

    <circle cx="256" cy="216" r="112" fill="#3B4AA0" opacity="0.55" clip-path="url(#right)"/>
    <g clip-path="url(#right)">
      <rect x="256" y="96" width="120" height="240" fill="url(#moon)" mask="url(#crescent)"/>
    </g>

    <path d="M0 398 L72 356 L136 390 L206 336 L282 392 L352 346 L432 386 L512 350 L512 512 L0 512 Z" fill="#252C68"/>
    <path d="M0 440 L92 404 L172 446 L252 410 L334 452 L424 414 L512 442 L512 512 L0 512 Z" fill="#0D1130"/>
