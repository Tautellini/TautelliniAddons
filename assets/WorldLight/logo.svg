<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34449A"/>
      <stop offset="0.55" stop-color="#1B2359"/>
      <stop offset="1" stop-color="#0B0F2A"/>
    </linearGradient>
    <radialGradient id="glow" cx="170" cy="420" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A4D" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF9A4D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="215" cy="190" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4B8"/>
      <stop offset="0.55" stop-color="#FFCB4A"/>
      <stop offset="1" stop-color="#FF9B2B"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6FF"/>
      <stop offset="1" stop-color="#AEBCF0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
    <clipPath id="left">
      <rect x="0" y="0" width="256" height="512"/>
    </clipPath>
    <clipPath id="right">
      <rect x="256" y="0" width="256" height="512"/>
    </clipPath>
    <mask id="crescent">
      <circle cx="256" cy="216" r="112" fill="#fff"/>
      <circle cx="210" cy="216" r="128" fill="#000"/>
    </mask>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <g fill="#FFFFFF">
      <circle cx="402" cy="84" r="4" opacity="0.95"/>
      <circle cx="452" cy="148" r="2.5" opacity="0.8"/>
      <circle cx="350" cy="58" r="2.5" opacity="0.7"/>
      <circle cx="462" cy="252" r="3" opacity="0.85"/>
      <circle cx="414" cy="316" r="2" opacity="0.6"/>
      <circle cx="300" cy="36" r="1.8" opacity="0.6"/>
    </g>

    <g stroke="#FFC23F" stroke-width="16" stroke-linecap="round">
      <line x1="219.8" y1="80.8" x2="208.9" y2="40.2"/>
      <line x1="157.0" y1="117.0" x2="127.3" y2="87.3"/>
      <line x1="120.8" y1="179.8" x2="80.2" y2="168.9"/>
      <line x1="120.8" y1="252.2" x2="80.2" y2="263.1"/>
