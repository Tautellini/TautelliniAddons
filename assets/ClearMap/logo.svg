<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sea" cx="250" cy="260" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6EAAC6"/>
      <stop offset="0.6" stop-color="#4C8DB0"/>
      <stop offset="1" stop-color="#3A7298"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="8" stdDeviation="7" flood-color="#5A321E" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="frame">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
    <path id="land" d="M 72 150 C 64 92 150 58 232 70 C 318 82 362 42 430 82 C 482 112 472 192 452 252
      C 432 320 474 384 432 432 C 390 480 300 470 240 450 C 170 428 112 462 76 412
      C 40 362 82 302 62 252 C 46 210 78 190 72 150 Z"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#sea)"/>

    <!-- islet -->
    <path d="M 430 438 C 446 424 474 430 476 450 C 478 470 456 480 440 472 C 428 466 422 448 430 438 Z"
      fill="#E6D4B8" stroke="#6AA3BD" stroke-width="4"/>

    <g transform="translate(46 34) scale(0.82)">
    <!-- shallow water: a soft light ring around the coast -->
    <use href="#land" fill="none" stroke="#A6D6E3" stroke-width="54" stroke-linejoin="round" opacity="0.75" filter="url(#soft)"/>
    <use href="#land" fill="#E6D4B8" stroke="#6AA3BD" stroke-width="5" stroke-linejoin="round"/>

    <!-- forest -->
    <path d="M 108 334 C 98 292 150 270 186 290 C 218 306 232 342 206 372 C 180 402 128 398 112 366 Z" fill="#B4B57F"/>
    <path d="M 330 352 C 352 330 392 336 400 362 C 408 392 380 410 352 402 C 330 396 316 372 330 352 Z" fill="#B4B57F"/>

    <!-- lake -->
    <ellipse cx="168" cy="178" rx="38" ry="24" fill="#93C9DC" stroke="#6AA3BD" stroke-width="4"/>

    <!-- cliffs: raised band with a soft shadow and a heavier top edge -->
    <g filter="url(#shadow)">
      <path d="M 300 108 C 352 92 414 110 424 160 C 434 212 392 244 350 232 C 320 224 302 202 280 206
        C 254 210 238 180 254 148 C 264 124 280 114 300 108 Z" fill="#C8A07C" stroke="#8E6446" stroke-width="7" stroke-linejoin="round"/>
    </g>
    <path d="M 334 150 C 352 142 376 150 378 168 C 380 186 360 194 344 186 C 330 180 322 160 334 150 Z" fill="#E6D4B8" stroke="#8E6446" stroke-width="4"/>

    <!-- road: constant width with an outline -->
    <path d="M 150 448 C 186 392 200 340 246 312 C 292 284 316 262 358 272 C 392 280 418 298 450 286"
      fill="none" stroke="#A47E5A" stroke-width="30" stroke-linecap="round"/>
    <path d="M 150 448 C 186 392 200 340 246 312 C 292 284 316 262 358 272 C 392 280 418 298 450 286"
      fill="none" stroke="#FBF4E8" stroke-width="19" stroke-linecap="round"/>

    <!-- cave entrance pin -->
    <circle cx="272" cy="214" r="24" fill="#FBF4E8" stroke="#4F2E20" stroke-width="3"/>
    <circle cx="272" cy="214" r="14" fill="#4F2E20"/>
    </g>
  </g>
</svg>
